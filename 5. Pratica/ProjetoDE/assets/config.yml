# Configurações da API
api:
  url: "https://randomuser.me/api/"
  timeout: 30
  default_results_per_page: 10
  max_results_per_page: 100

# Configurações de validação
validation:
  required_fields:
    - email
    - phone
    - gender
    - nat

# Configurações de preparação dos dados
preparation:
  # Mapeamento de colunas (origem -> destino)
  column_mapping:
    name: nome_completo
    email: email
    phone: telefone
    cell: celular
    gender: genero
    nat: nacionalidade
    location: localizacao

  # Tipos de dados para conversão
  data_types:
    text_columns:
      - nome_completo
      - email
      - telefone
      - celular
      - genero
      - nacionalidade

  # Padrão regex para limpeza de caracteres especiais
  # Mantém: letras, números, espaços, @, ponto, hífen
  clean_regex: "[^a-zA-Z0-9\\s@.\\-]"

# Configurações do banco de dados
database:
  filename: "dados.db"
  table_name: "usuarios"
  if_exists: "replace"  # replace, append, fail

# Configurações de logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(levelname)s - %(message)s"