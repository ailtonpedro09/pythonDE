[tox]
envlist = py
skipsdist = True

[testenv]
basepython = python3
setenv =
    PYTHONPATH = {toxinidir}/src:{toxinidir}
deps =
    -rrequirements.txt
    pytest
    mypy
commands =
    # Testes unitários
    python -m pytest tests/ -v

    # Verificação estática de tipo
    python -m mypy src --ignore-missing-imports

    # Checagem rápida de sintaxe
    python -m py_compile src/core.py src/utils.py src/app.py tests/test_main.py

[testenv:lint]
basepython = python3
deps =
    flake8
commands =
    flake8 src tests
